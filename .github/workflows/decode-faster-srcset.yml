name: decode-faster-srcset
on:
  push:
    paths:
      - 'assets/img/*-*.jpg.b64'
      - 'assets/img/*-*.webp.b64'
      - '.github/workflows/decode-faster-srcset.yml'
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode srcset variants
        run: |
          set -e
          shopt -s nullglob
          for f in assets/img/*-*.jpg.b64 assets/img/*-*.webp.b64; do
            out="${f%.b64}"
            base64 -d "$f" > "$out"
            echo "decoded $out ($(wc -c < "$out") bytes)"
          done
          rm -f assets/img/*-*.jpg.b64 assets/img/*-*.webp.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/img/
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "SEO: apply Faster responsive srcset image variants from b64"
            git push
          fi
