name: a11y-html
on:
  push:
    paths:
      - '.github/workflows/a11y-html.yml'
      - '_build/a11y_apply.py'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply a11y HTML fixes
        run: |
          set -euo pipefail
          python3 _build/a11y_apply.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "a11y: brand aria-label match; honeypot aria-hidden"
            git push
          fi
