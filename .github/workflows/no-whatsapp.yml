name: no-whatsapp
on:
  push:
    paths:
      - '.github/workflows/no-whatsapp.yml'
      - '_build/no-whatsapp.patch'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch and rebuild
        run: |
          set -euo pipefail
          if [ ! -f _build/no-whatsapp.patch ]; then echo "no patch"; exit 0; fi
          git apply _build/no-whatsapp.patch
          git rm -q _build/no-whatsapp.patch
          perl _build/build.pl
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!.github'
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "Remove WhatsApp everywhere (buttons, header, footer, mobile bar, copy, meta, CSS); call buttons stay"
            git push
          fi
