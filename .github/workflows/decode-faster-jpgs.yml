name: decode-faster-jpgs
on:
  push:
    paths:
      - 'assets/img/*.jpg.b64'
      - '.github/workflows/decode-faster-jpgs.yml'
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode JPGs from b64
        run: |
          set -e
          for f in assets/img/*.jpg.b64; do
            [ -f "$f" ] || continue
            out="${f%.b64}"
            base64 -d "$f" > "$out"
            echo "decoded $out ($(wc -c < "$out") bytes)"
          done
          rm -f assets/img/*.jpg.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/img/
          if git diff --cached --quiet; then
            echo "no image changes"
          else
            git commit -m "SEO: apply compressed Faster JPGs from b64"
            git push
          fi
